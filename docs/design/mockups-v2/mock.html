<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--font:"Inter","IBM Plex Sans Arabic","Noto Sans Arabic","Noto Sans",system-ui,sans-serif;
--bg:#0E1013;--side:#0A0C0F;--s1:#15181D;--s2:#1B1F25;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
--t1:#ECEEF2;--t2:#9AA2AF;--t3:#6B7380;--ac:#67DBF3;--acink:#061219;--ok:#5BD6A0;--warn:#F2B35B}
.light{--bg:#F7F7F5;--side:#EFEFEC;--s1:#FFFFFF;--s2:#F1F1EE;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);
--t1:#17191D;--t2:#5B6370;--t3:#8A919C;--ac:#0A7C93;--acink:#fff}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:264px 1fr;height:100vh}
aside{background:var(--side);border-inline-end:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}.brand img{height:22px}.brand b{font-weight:600;font-size:15px;letter-spacing:.02em}
.new{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line2);color:var(--t1);font:inherit;font-weight:500;margin-bottom:10px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:9px;color:var(--t2);text-decoration:none;font-weight:500}
.nav a.on{background:var(--s2);color:var(--t1)}.nav a i{width:16px;height:16px;border:1.6px solid currentColor;border-radius:5px;opacity:.85}
.nav a:nth-child(2) i{border-radius:50%}.nav a:nth-child(3) i{border-radius:3px 9px 3px 9px}
.lbl{font-size:12px;color:var(--t3);padding:16px 12px 6px;font-weight:500}
.recent a{display:block;padding:7px 12px;border-radius:9px;color:var(--t2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px}.me:hover{background:var(--s2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:600;font-size:12px}
main{overflow:auto;display:flex;flex-direction:column;align-items:center;padding:0 40px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;height:56px;color:var(--t2)}
.pill{padding:5px 11px;border:1px solid var(--line2);border-radius:99px;font-size:12.5px;color:var(--t2)}
.wrap{width:100%;max-width:760px;padding:6vh 0 40px}
h1{font-size:30px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px;text-align:center}
.sub{color:var(--t2);text-align:center;margin:0 0 28px;font-size:15px}
.comp{background:var(--s1);border:1px solid var(--line2);border-radius:20px;padding:16px 16px 12px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.comp .ph{color:var(--t3);font-size:15px;min-height:46px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.tool{padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--t2);font-size:12.5px;background:transparent}
.send{width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--acink);display:grid;place-items:center;font-weight:700}
.chips{display:flex;gap:8px;justify-content:center;margin:16px 0 34px;flex-wrap:wrap}
.chips span{padding:7px 14px;border:1px solid var(--line2);border-radius:99px;color:var(--t2)}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--t2)}
.task{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}
.ck{width:18px;height:18px;border:1.6px solid var(--line2);border-radius:6px}.ck.d{background:var(--ac);border-color:var(--ac)}
.tag{font-size:11.5px;color:var(--t3);margin-inline-start:auto}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.btn{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:10px;background:var(--ac);color:var(--acink);font-weight:600}
.bar{height:5px;border-radius:9px;background:var(--s2);margin-top:12px}.bar i{display:block;height:100%;width:62%;background:var(--ac);border-radius:9px}
/* study */
.study{display:grid;grid-template-columns:1fr 1fr;gap:0;width:100%;flex:1;border-top:1px solid var(--line);margin:0 -40px;width:calc(100% + 80px)}
.pdf{background:var(--side);padding:28px;display:flex;justify-content:center;overflow:hidden}
.page{width:100%;max-width:420px;background:#fff;color:#222;border-radius:6px;padding:34px 30px;box-shadow:0 8px 30px rgba(0,0,0,.35);height:560px}
.page div{height:7px;background:#dcdfe4;border-radius:3px;margin:9px 0}.page .t{height:14px;width:55%;background:#222;margin-bottom:22px}
.sum{padding:28px 34px;max-width:620px}.sum h2{font-size:20px;margin:0 0 4px;font-weight:600}.sum p{color:var(--t2);margin:0 0 18px}
.pt{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.pg{flex:none;font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--s2);color:var(--ac);height:22px;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;margin-bottom:18px}.tabs span{padding:6px 13px;border-radius:99px;color:var(--t2)}.tabs .on{background:var(--s2);color:var(--t1)}
</style></head><body>
<div id="r"></div>
<script>
const q=new URLSearchParams(location.search),ar=q.get('lang')==='ar',light=q.get('theme')==='light',scr=q.get('s')||'home';
document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';if(light)document.body.classList.add('light');
const T=ar?{n:'جلسة جديدة',h:'الرئيسية',p:'التخطيط',l:'المكتبة',pr:'المشاريع',e:'الاختبارات',rc:'الأخيرة',
r:['ملخص الفصل 3 — الاقتصاد','أسئلة الإحصاء الوسيط','خطة أسبوع الاختبارات'],g:'مساء الخير، PSEVN',s:'ماذا تريد أن تدرس اليوم؟',
ph:'اسأل عن مادتك، أو الصق ملخصاً، أو ارفع ملف PDF…',tl:['إرفاق ملف','المادة'],ch:['لخّص ملف PDF','اختبرني','رتّب أسبوعي'],
td:'اليوم',tk:['مراجعة الفصل 3 — اقتصاد 201','حل ورقة الإحصاء','قراءة 20 صفحة — قانون'],tm:['٤٥ د','٦٠ د','٣٠ د'],
fc:'جلسة تركيز',st:'ابدأ',ex:'الاختبار القادم',dy:'٩ أيام',pg:'تقدّم الأسبوع',
sh:'الفصل 3 — العرض والطلب',ss:'ملخص من ملفك فقط، مع أرقام الصفحات',tb:['ملخص','أسئلة','بطاقات'],
pts:['المنحنى ينتقل عند تغيّر عامل غير السعر، لا عند تغيّر السعر نفسه.','المرونة السعرية تقيس حساسية الكمية المطلوبة للسعر.','التوازن يتحقق عند تساوي الكمية المعروضة والمطلوبة.'],pgs:['ص ٤','ص ٩','ص ١٢'],me:'الحساب',us:'PSEVN'}
:{n:'New study session',h:'Home',p:'Planning',l:'Library',pr:'Projects',e:'Exams',rc:'Recent',
r:['Chapter 3 summary — Econ 201','Statistics median questions','Exam week plan'],g:'Good afternoon, PSEVN',s:'What do you want to study today?',
ph:'Ask about a course, paste notes, or upload a PDF…',tl:['Attach file','Course'],ch:['Summarize a PDF','Quiz me','Plan my week'],
td:'Today',tk:['Review Chapter 3 — Econ 201','Statistics problem set','Read 20 pages — Law 101'],tm:['45 min','60 min','30 min'],
fc:'Focus session',st:'Start',ex:'Next exam',dy:'9 days',pg:'Week progress',
sh:'Chapter 3 — Supply and demand',ss:'Summary from your file only, with page references',tb:['Summary','Questions','Flashcards'],
pts:['The curve shifts when a non-price factor changes, not when the price itself changes.','Price elasticity measures how sensitive quantity demanded is to price.','Equilibrium is reached where quantity supplied equals quantity demanded.'],pgs:['p. 4','p. 9','p. 12'],me:'Account',us:'PSEVN'};
const nav=`<div class="nav"><a class="${scr=='home'?'on':''}"><i></i>${T.h}</a><a><i></i>${T.p}</a><a class="${scr=='study'?'on':''}"><i></i>${T.l}</a><a><i></i>${T.pr}</a><a><i></i>${T.e}</a></div>`;
const side=`<aside><div class="brand"><img src="az-mark.svg"><b>AZ</b></div><button class="new">＋ ${T.n}</button>${nav}<div class="lbl">${T.rc}</div><div class="recent">${T.r.map(x=>`<a>${x}</a>`).join('')}</div><div class="me"><div class="av">P</div><span>${T.us}</span></div></aside>`;
const home=`<div class="wrap"><h1>${T.g}</h1><p class="sub">${T.s}</p>
<div class="comp"><div class="ph">${T.ph}</div><div class="row"><span class="tool">＋ ${T.tl[0]}</span><span class="tool">${T.tl[1]}</span><span class="sp"></span><span class="send">↑</span></div></div>
<div class="chips">${T.ch.map(x=>`<span>${x}</span>`).join('')}</div>
<div class="grid"><div class="card"><h3>${T.td}</h3>${T.tk.map((x,i)=>`<div class="task"><span class="ck ${i==0?'d':''}"></span><span>${x}</span><span class="tag">${T.tm[i]}</span></div>`).join('')}</div>
<div style="display:grid;gap:14px"><div class="card"><h3>${T.fc}</h3><div class="big">25:00</div><span class="btn">${T.st}</span></div>
<div class="card"><h3>${T.ex}</h3><div class="big">${T.dy}</div><div class="bar"><i></i></div><div class="tag" style="margin:8px 0 0">${T.pg}</div></div></div></div></div>`;
const study=`<div class="study"><div class="pdf"><div class="page"><div class="t"></div>${'<div></div>'.repeat(9)}<div style="width:60%"></div>${'<div></div>'.repeat(6)}</div></div>
<div class="sum"><div class="tabs">${T.tb.map((x,i)=>`<span class="${i==0?'on':''}">${x}</span>`).join('')}</div><h2>${T.sh}</h2><p>${T.ss}</p>${T.pts.map((x,i)=>`<div class="pt"><span class="pg">${T.pgs[i]}</span><span>${x}</span></div>`).join('')}</div></div>`;
document.getElementById('r').innerHTML=`<div class="app">${side}<main><div class="top"><span class="pill">Qatar University</span><span class="pill">EN / ع</span></div>${scr=='home'?home:study}</main></div>`;
</script></body></html>
