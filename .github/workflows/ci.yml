name: AZ web CI

on:
  push:
    branches:
      - main
      - feature/az-projects-mvp
  pull_request:
    branches:
      - main
      - feature/az-projects-mvp
      - "fix/**"

permissions:
  contents: read

jobs:
  sync-editor-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/az-projects-collaboration-p0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out collaboration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate updated npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile for collaborative editor"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  build:
    needs: sync-editor-lockfile
    if: always() && (needs.sync-editor-lockfile.result == 'success' || needs.sync-editor-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  collaboration-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collaboration-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collaboration worker dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Type-check collaboration worker
        run: npm run typecheck
      - name: Test Yjs persistence and Worker runtime smoke tests
        run: npm test
      - name: Test real two-client collaboration over WebSockets
        run: npm run test:integration
