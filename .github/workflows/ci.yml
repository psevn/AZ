name: AZ web CI

on:
  push:
    branches:
      - main
      - feature/az-projects-mvp
      - "fix/**"
  pull_request:
    branches:
      - main
      - feature/az-projects-mvp
      - "fix/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  collaboration-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collaboration-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collaboration worker dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check collaboration worker
        run: npm run typecheck
      - name: Test Yjs persistence and two-client WebSocket collaboration
        run: npm test
