name: AZ web CI

on:
  push:
    branches:
      - main
      - feature/az-projects-mvp
      - "fix/**"
  pull_request:
    branches:
      - main
      - feature/az-projects-mvp
      - "fix/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
