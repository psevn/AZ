name: Document Signed URL Contract

on:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/components/DocumentUpload.tsx"
      - "src/components/DocumentLibrary.tsx"
      - "src/lib/extractPdfText.ts"
      - "src/lib/pdfTextPipeline.mjs"
      - "src/lib/pdfTextPipeline.d.mts"
      - "src/styles.css"
      - "supabase/functions/create-document-signed-url/**"
      - "supabase/functions/create-document-upload-url/**"
      - "supabase/functions/process-document-pages/**"
      - "tests/documentSignedUrlContract.test.mjs"
      - "tests/documentUploadContract.test.mjs"
      - "tests/documentLibraryContract.test.mjs"
      - "tests/documentProcessingContract.test.mjs"
      - "tests/pdfTextPipeline.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/document-signed-url.yml"
  push:
    branches:
      - "fix/document-signed-url-endpoint-20261111"
    paths:
      - "src/App.tsx"
      - "src/components/DocumentUpload.tsx"
      - "supabase/functions/create-document-signed-url/**"
      - "supabase/functions/create-document-upload-url/**"
      - "tests/documentSignedUrlContract.test.mjs"
      - "tests/documentUploadContract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/document-signed-url.yml"

permissions:
  contents: read

jobs:
  document-signed-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test document signed URL security contract
        run: npm run test:document-signed-url
      - name: Test PDF upload security contract
        run: npm run test:document-upload
      - name: Test document library contract
        run: npm run test:document-library
      - name: Test document processing contract
        run: npm run test:document-processing
      - name: Test PDF text pipeline
        run: npm run test:pdf-pipeline
      - name: Build web application
        run: npm run build
