name: Document Signed URL Contract
concurrency:
  # Keep the newest run for each workflow and source branch; never skip the latest check.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/components/DocumentUpload.tsx"
      - "src/components/DocumentReader.tsx"
      - "src/components/DocumentLibrary.tsx"
      - "src/components/DocumentReader.tsx"
      - "src/lib/extractPdfText.ts"
      - "src/lib/pdfTextPipeline.mjs"
      - "src/lib/recoverDocumentProcessing.ts"
      - "src/lib/pdfTextPipeline.d.mts"
      - "src/styles.css"
      - "supabase/functions/create-document-signed-url/**"
      - "supabase/functions/create-document-upload-url/**"
      - "supabase/functions/process-document-pages/**"
      - "supabase/functions/_shared/rateLimit.ts"
      - "supabase/functions/_shared/cors.ts"
      - "supabase/migrations/20261112100000_edge_function_rate_limits.sql"
      - "supabase/tests/verify_edge_rate_limits.sh"
      - "supabase/migrations/*atomic_document_processing.sql"
      - "tests/documentSignedUrlContract.test.mjs"
      - "tests/documentUploadContract.test.mjs"
      - "tests/documentLimitsContract.test.mjs"
      - "tests/edgeRateLimitsContract.test.mjs"
      - "tests/edgeCorsAllowlist.test.mjs"
      - "tests/pageReferenceTrustContract.test.mjs"
      - "tests/documentLibraryContract.test.mjs"
      - "tests/documentProcessingContract.test.mjs"
      - "tests/documentProcessingAtomic.test.mjs"
      - "tests/documentRecoveryContract.test.mjs"
      - "tests/pdfTextPipeline.test.mjs"
      - "tests/documentReaderContract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/document-signed-url.yml"
  push:
    branches:
      - "fix/document-signed-url-endpoint-20261111"
    paths:
      - "src/App.tsx"
      - "src/components/DocumentUpload.tsx"
      - "supabase/functions/create-document-signed-url/**"
      - "supabase/functions/create-document-upload-url/**"
      - "tests/documentSignedUrlContract.test.mjs"
      - "tests/documentUploadContract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/document-signed-url.yml"

permissions:
  contents: read

jobs:
  document-signed-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test document signed URL security contract
        run: npm run test:document-signed-url
      - name: Test PDF upload security contract
        run: npm run test:document-upload
      - name: Test document and extracted-text quotas
        run: npm run test:document-limits
      - name: Test per-user Edge Function rate limits
        run: npm run test:edge-rate-limits
      - name: Test fail-closed CORS allowlist
        run: npm run test:edge-cors
      - name: Test unverified PDF page-reference labeling
        run: npm run test:page-reference-trust
      - name: Test document library contract
        run: npm run test:document-library
      - name: Test document processing contract
        run: npm run test:document-processing
      - name: Test PDF text pipeline
        run: npm run test:pdf-pipeline
      - name: Test interrupted document recovery
        run: npm run test:document-recovery
      - name: Test atomic document processing
        run: npm run test:document-atomic
      - name: Test document reader contract
        run: npm run test:document-reader
      - name: Build web application
        run: npm run build
