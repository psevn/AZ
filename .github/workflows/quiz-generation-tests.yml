name: Quiz Generation Contract Tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/quizGeneration.*"
      - "supabase/functions/generate-quiz/**"
      - "tests/quizGeneration.test.mjs"
      - "tests/quizCostControls.test.mjs"
      - "tests/rateLimitContract.test.mjs"
      - "tests/corsAllowlistContract.test.mjs"
      - "docs/EDGE_CORS.md"
      - "supabase/functions/_shared/rateLimit.ts"
      - "supabase/functions/_shared/cors.ts"
      - "supabase/migrations/**"
      - "supabase/proposals/create_generated_quiz_rpc.sql"
      - "src/components/QuizPage.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quiz-generation-tests.yml"
  push:
    branches:
      - "feature/azi-openai-quiz-foundation"
    paths:
      - "supabase/functions/_shared/quizGeneration.*"
      - "supabase/functions/generate-quiz/**"
      - "tests/quizGeneration.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quiz-generation-tests.yml"

permissions:
  contents: read

jobs:
  quiz-generation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test quiz generation contract
        run: npm run test:quiz-generation
      - name: Test quiz cost and idempotency contracts
        run: npm run test:quiz-cost-controls
      - name: Test endpoint rate limit contract
        run: npm run test:rate-limits
      - name: Test CORS allowlist contract
        run: npm run test:cors-allowlist
