# Visual QA: builds the app in DEMO mode (fixture data, no Supabase), screenshots every main section
# (desktop + mobile, EN/AR, dark/light, plain/universe) and uploads them as an artifact for human/AI review.
# Demo mode is a build-time flag used only here; it never connects to a real backend.
name: Visual QA
concurrency:
  # Keep the newest run for each workflow and source branch; never skip the latest check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["design/**"]
  push:
    branches: ["design/**", "feature/azi-intelligence-core"]
  workflow_dispatch:
permissions:
  contents: write # only to publish screenshots to the visual-qa/* branch
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test quick-add regressions
        run: npm run test:quick-add
      - name: Test Arabic pluralization
        run: npm run test:arabic-plural
      - name: Test minimum readable typography
        run: npm run test:typography
      - run: npm run build
        env:
          VITE_DEMO: "1"
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.0
      - run: npx playwright install chromium
      - name: Serve and capture
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node scripts/visual-qa.mjs http://127.0.0.1:4173 visual-qa-output
      - name: Publish screenshots to a review branch (so they can be reviewed from git)
        if: success()
        run: |
          cd visual-qa-output
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b vqa
          git add -A
          git commit -q -m "visual QA screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "vqa:refs/heads/visual-qa/${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-screenshots
          path: visual-qa-output
          retention-days: 14
