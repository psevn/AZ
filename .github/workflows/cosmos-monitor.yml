# EZORD COSMOS — Phase 0: repository monitoring (no AI models, no secrets, no cost beyond Actions minutes).
# 1) Opens (or comments on) a GitHub Issue when "AZ web CI" fails on a branch.
# 2) Posts a weekly digest Issue with recent activity.
# Read-only on code: only creates/comments on Issues. Never merges, deploys or touches the database.
name: EZORD COSMOS monitor

on:
  workflow_run:
    workflows: ["AZ web CI"]
    types: [completed]
  schedule:
    - cron: "0 5 * * 0" # Sundays 05:00 UTC = 08:00 Qatar
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="CI failing on ${BRANCH}"
          body="AZ web CI failed on \`${BRANCH}\` at \`${SHA:0:7}\`.\n\nRun: ${RUN_URL}\n\n_Opened by EZORD COSMOS monitor. It is closed automatically when CI passes on this branch._"
          existing=$(gh issue list --repo "$REPO" --state open --label cosmos-ci --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          gh label create cosmos-ci --repo "$REPO" --color B60205 --description "CI failure reported by COSMOS" 2>/dev/null || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$(printf "Still failing at \`${SHA:0:7}\`: ${RUN_URL}")"
          else
            gh issue create --repo "$REPO" --title "$title" --label cosmos-ci --body "$(printf "$body")"
          fi

  ci-recovered:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close failure issue for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          title="CI failing on ${BRANCH}"
          existing=$(gh issue list --repo "$REPO" --state open --label cosmos-ci --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" --comment "CI passed again: ${RUN_URL}"
          fi

  weekly-digest:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Post weekly digest issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "## Open pull requests"
            gh pr list --repo "$REPO" --state open --json number,title,headRefName,updatedAt --jq '.[] | "- #\(.number) \(.title) (`\(.headRefName)`, updated \(.updatedAt[0:10]))"'
            echo
            echo "## Merged in the last 7 days"
            gh pr list --repo "$REPO" --state merged --search "merged:>=${since:0:10}" --json number,title --jq '.[] | "- #\(.number) \(.title)"'
            echo
            echo "## Open CI-failure issues"
            gh issue list --repo "$REPO" --state open --label cosmos-ci --json number,title --jq '.[] | "- #\(.number) \(.title)"'
            echo
            echo "_Generated by EZORD COSMOS monitor (Phase 0). Facts only, no AI analysis._"
          } > digest.md
          gh label create cosmos-digest --repo "$REPO" --color 1D76DB --description "Weekly COSMOS digest" 2>/dev/null || true
          gh issue create --repo "$REPO" --title "COSMOS weekly digest $(date -u +%Y-%m-%d)" --label cosmos-digest --body-file digest.md
