name: Quiz Runtime And Answer Security

on:
  pull_request:
    paths:
      - "src/components/QuizPage.tsx"
      - "src/App.tsx"
      - "src/lib/aziDailyChallenge.d.mts"
      - "tests/aziDailyChallenge.test.mjs"
      - "src/lib/aziDailyChallenge.mjs"
      - "tests/aziDailyChallenge.test.mjs"
      - "supabase/proposals/secure_quiz_answer_response.sql"
      - "tests/quizAnswerSecurity.test.mjs"
      - "tests/quizRuntimeContract.test.mjs"
      - "tests/dailyChallengePersistenceContract.test.mjs"
      - "tests/sql/**"
      - "supabase/proposals/azi_daily_challenge_completion.sql"
      - "supabase/migrations/**"
      - "tests/quizPersistenceContract.test.mjs"
      - "tests/quizGeneration.test.mjs"
      - "supabase/functions/generate-quiz/**"
      - "supabase/functions/_shared/quizGeneration.mjs"
      - "supabase/proposals/create_generated_quiz_rpc.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quiz-answer-security.yml"

permissions:
  contents: read

jobs:
  quiz-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify quiz runtime contract
        run: npm run test:quiz-runtime
      - name: Verify Daily Challenge selection
        run: npm run test:azi-daily-challenge
      - name: Verify safe answer response proposal
        run: node --test tests/quizAnswerSecurity.test.mjs
      - name: Verify quiz generation contract
        run: npm run test:quiz-generation
      - name: Verify generated quiz persistence security
        run: npm run test:quiz-persistence
      - name: Verify Daily Challenge question minimum
        run: npm run test:azi-daily-challenge
      - name: Verify Daily Challenge completion persistence
        run: npm run test:daily-challenge-persistence

  daily-challenge-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: az_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d az_sql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: az_sql_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated Supabase-compatible test schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/daily-challenge-fixture.sql
      - name: Apply Daily Challenge proposal to isolated PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/azi_daily_challenge_completion.sql
      - name: Verify completion, idempotency, ownership, RLS, and grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/daily-challenge-integration.sql

  prepare-daily-challenge-migration:
    runs-on: ubuntu-latest
    needs: daily-challenge-postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Generate migration filename with Supabase CLI
        id: migration
        run: |
          supabase --version
          supabase migration new azi_daily_challenge_completion
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_azi_daily_challenge_completion.sql' -print -quit)"
          test -n "$migration_file"
          cp supabase/proposals/azi_daily_challenge_completion.sql "$migration_file"
          echo "path=$migration_file" >> "$GITHUB_OUTPUT"
      - name: Upload CLI-generated migration preview
        uses: actions/upload-artifact@v4
        with:
          name: azi-daily-challenge-migration-preview
          path: ${{ steps.migration.outputs.path }}
          if-no-files-found: error
